<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Vtuber WebUI 重设计原型</title>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --line: #e4e7ec;
    --line-strong: #d0d5dd;
    --ink: #101828;
    --ink-2: #475467;
    --ink-mut: #98a2b3;
    --accent: #4f46e5;
    --accent-weak: #eef0fe;
    --ok: #15803d;
    --ok-weak: #ecfdf3;
    --warn: #b45309;
    --warn-weak: #fffbeb;
    --err: #b42318;
    --err-weak: #fef3f2;
    --radius: 10px;
    --shadow-pop: 0 8px 28px rgba(16, 24, 40, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  ::selection { background: var(--accent-weak); }

  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* ---------- 布局骨架 ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 208px; flex: none; background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 18px 18px 14px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; flex: none;
  }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  .brand-sub { font-size: 11px; color: var(--ink-mut); margin-top: -3px; }
  .nav { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border: 0; background: none; border-radius: 8px;
    color: var(--ink-2); text-align: left; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: #f2f4f7; color: var(--ink); }
  .nav-item.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  .nav-item .nav-badge {
    margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent);
    color: #fff; border-radius: 99px; padding: 0 7px; line-height: 18px;
  }
  .sidebar-foot { margin-top: auto; padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .ghost-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    padding: 7px 0; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-2); font-size: 12.5px;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .proto-note { font-size: 11px; color: var(--ink-mut); text-align: center; line-height: 1.5; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
    padding: 0 26px; height: 58px; background: rgba(255,255,255,.94); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-title { font-size: 15px; font-weight: 700; }
  .topbar-sub { font-size: 12px; color: var(--ink-mut); margin-top: -2px; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .searchbox {
    display: flex; align-items: center; gap: 7px; border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 5px 10px; color: var(--ink-mut); min-width: 180px; background: var(--surface);
  }
  .searchbox kbd {
    margin-left: auto; font: 10.5px ui-monospace, monospace; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; color: var(--ink-mut); background: #f8f9fb;
  }
  .content { padding: 22px 26px 70px; max-width: 1240px; width: 100%; margin: 0 auto; }

  /* ---------- 通用组件 ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 14px; font-weight: 500;
  }
  .btn:hover { border-color: var(--ink-mut); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; }
  .btn.danger { color: var(--err); border-color: #f4b6b1; }
  .btn.danger:hover { background: var(--err-weak); }
  .btn.sm { padding: 3px 10px; font-size: 12px; border-radius: 6px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 99px;
    padding: 3px 11px; font-size: 12px; font-weight: 600; border: 1px solid var(--line);
    background: var(--surface);
  }
  .dot { width: 7px; height: 7px; border-radius: 99px; flex: none; }

  .tag {
    display: inline-flex; align-items: center; border-radius: 5px; font-size: 11px;
    padding: 1px 7px; font-weight: 500; border: 1px solid var(--line); color: var(--ink-2); background: #fafbfc;
  }
  .tag.free { color: var(--ok); border-color: #bce3c6; background: var(--ok-weak); }
  .tag.key { color: var(--warn); border-color: #f1dca8; background: var(--warn-weak); }
  .tag.local { color: var(--accent); border-color: #cdd0fb; background: var(--accent-weak); }

  .banner {
    display: flex; gap: 10px; align-items: flex-start; border-radius: 8px;
    padding: 10px 13px; font-size: 12.5px; line-height: 1.65;
  }
  .banner.warn { background: var(--warn-weak); color: var(--warn); border: 1px solid #f3e2bb; }
  .banner.info { background: var(--accent-weak); color: #3d38b8; border: 1px solid #d9dcfb; }

  /* 选卡墙 */
  .pick-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
  .pick-card {
    position: relative; text-align: left; background: var(--surface); border: 1.5px solid var(--line);
    border-radius: var(--radius); padding: 12px 13px; transition: border-color .12s, box-shadow .12s;
  }
  .pick-card:hover { border-color: var(--line-strong); }
  .pick-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .pick-name { font-weight: 650; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .pick-desc { color: var(--ink-2); font-size: 12px; margin-top: 3px; line-height: 1.55; }
  .pick-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .pick-check {
    position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 99px;
    border: 1.5px solid var(--line-strong); background: var(--surface); display: flex; align-items: center; justify-content: center;
  }
  .pick-card.on .pick-check { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 表单 */
  .form-row { display: grid; grid-template-columns: 210px 1fr; gap: 10px 18px; align-items: start; padding: 8px 0; }
  .form-row + .form-row { border-top: 1px dashed #eef0f3; }
  .form-label { font-weight: 550; padding-top: 6px; }
  .form-label .req { color: var(--err); margin-right: 3px; }
  .form-label .unit { color: var(--ink-mut); font-weight: 400; }
  .form-ctrl input[type=text], .form-ctrl input[type=password], .form-ctrl input[type=number], .form-ctrl select, .form-ctrl textarea {
    width: 100%; max-width: 560px; border: 1px solid var(--line-strong); border-radius: 7px;
    padding: 6px 10px; background: var(--surface); outline: none;
  }
  .form-ctrl textarea { min-height: 64px; resize: vertical; line-height: 1.6; }
  .form-ctrl input:focus, .form-ctrl select:focus, .form-ctrl textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .form-hint { color: var(--ink-mut); font-size: 11.5px; margin-top: 3px; }

  .adv-toggle {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: none;
    color: var(--ink-2); font-weight: 550; font-size: 12.5px; padding: 4px 0;
  }
  .adv-toggle:hover { color: var(--accent); }
  .adv-body { border-top: 1px dashed var(--line-strong); margin-top: 8px; padding-top: 4px; }

  /* 开关 */
  .switch { position: relative; width: 36px; height: 21px; flex: none; display: inline-block; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .switch .track { position: absolute; inset: 0; border-radius: 99px; background: #d6dae2; transition: background .15s; }
  .switch .knob { position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 99px; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .knob { left: 17.5px; }

  /* 信号链 */
  .chain { display: flex; align-items: stretch; gap: 0; }
  .chain-node { flex: 1; min-width: 0; }
  .chain-arrow { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--ink-mut); }

  /* 步骤条 */
  .steps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .step-item { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 8px; border-radius: 8px; color: var(--ink-2); }
  .step-item:hover { background: #f2f4f7; }
  .step-item.on { color: var(--accent); font-weight: 650; }
  .step-item.done { color: var(--ok); }
  .step-idx {
    width: 22px; height: 22px; border-radius: 99px; border: 1.5px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 650; flex: none;
  }
  .step-item.on .step-idx { border-color: var(--accent); background: var(--accent); color: #fff; }
  .step-item.done .step-idx { border-color: var(--ok); background: var(--ok-weak); color: var(--ok); }
  .step-line { width: 26px; height: 1px; background: var(--line-strong); flex: none; }

  /* 玩法库 */
  .play-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .play-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
  .play-card.on { border-color: #b9c4f5; }
  .play-head { display: flex; align-items: center; gap: 9px; }
  .play-name { font-weight: 650; font-size: 13.5px; }
  .play-desc { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .play-body { border-top: 1px dashed var(--line); margin-top: 11px; padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .mini-field { display: flex; align-items: center; gap: 10px; }
  .mini-field label { width: 92px; flex: none; color: var(--ink-2); font-size: 12px; }
  .mini-field input, .mini-field select {
    flex: 1; border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 9px; min-width: 0;
  }

  /* 拖拽列表 */
  .drag-list { display: flex; flex-direction: column; gap: 6px; max-width: 620px; }
  .drag-item {
    display: flex; align-items: center; gap: 11px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px; cursor: grab;
  }
  .drag-item.dragging { opacity: .4; border-style: dashed; }
  .drag-item.over { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .drag-rank { width: 20px; height: 20px; border-radius: 6px; background: #f2f4f7; color: var(--ink-2); font-size: 11.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }

  /* 浮层 */
  .backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.45); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); max-width: 640px; width: 100%; max-height: 86vh; overflow: auto; }
  .modal.wide { max-width: 860px; }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 22px 0; }
  .modal-head h3 { margin: 0; font-size: 15.5px; }
  .modal-body { padding: 12px 22px 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 22px 20px; }

  /* toast */
  .toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    display: flex; align-items: center; gap: 9px; background: #101828; color: #f4f6f8;
    border-radius: 9px; padding: 9px 16px; font-size: 13px; box-shadow: var(--shadow-pop);
    animation: toast-in .18s ease-out;
  }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .sec-title { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .sec-title .count { font-weight: 500; color: var(--ink-mut); }
  .muted { color: var(--ink-mut); }
  .flex { display: flex; align-items: center; gap: 10px; }
  .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 13px; font-size: 12.5px; color: var(--ink-2); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 向导 */
  .wiz-steps { display: flex; gap: 0; margin-bottom: 18px; }
  .wiz-seg { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--ink-mut); font-size: 12px; }
  .wiz-seg .bar { flex: 1; height: 3px; border-radius: 99px; background: var(--line); }
  .wiz-seg.done .bar, .wiz-seg.cur .bar { background: var(--accent); }
  .wiz-seg.cur { color: var(--accent); font-weight: 600; }
  .wiz-seg.done { color: var(--ok); }
</style>
</head>

<div id="root"></div>

<!-- ============ 块 1：图标 / 基础组件 / 数据 ============ -->
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;

/* ---------- 图标（16px 线性） ---------- */
function I({ d, size = 16, sw = 1.7, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none', ...style }}>
      <path d={d} />
    </svg>

}
const P = {
  dash: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',

  gear: 'M12 9a3 3 0 100 6 3 3 0 000-6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1',
  play: 'M7 5l12 7-12 7z',
  stop: 'M6 6h12v12H6z',
  save: 'M12 3v11M8 10l4 4 4-4M4 17v3h16v-3',
  search: 'M10.5 4a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM20 20l-4.8-4.8',
  check: 'M4.5 12.5l5 5L19.5 7',
  alert: 'M12 3L2.5 20h19zM12 10v4M12 17.5v.5',
  grip: 'M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01',
  chevD: 'M6 9l6 6 6-6',
  chevR: 'M9 6l6 6-6 6',
  arrowR: 'M4 12h15M13 6l6 6-6 6',
  radio: 'M12 8a4 4 0 100 8 4 4 0 000-8zM4.9 4.9l2 2M17.1 4.9l-2 2M12 2v2M12 20v2M4.9 19.1l2-2M17.1 19.1l-2-2',
  brain: 'M9 4a3 3 0 00-3 3 3 3 0 00-1 5.8V16a3 3 0 003 3h1V4zM15 4a3 3 0 013 3 3 3 0 011 5.8V16a3 3 0 01-3 3h-1V4z',
  mic: 'M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3zM6 11a6 6 0 0012 0M12 17v4',
  speaker: 'M4 10v4h3l5 4V6l-5 4zM16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11',
  person: 'M12 4a3.5 3.5 0 100 7 3.5 3.5 0 000-7zM5 20c1-4 3.5-6 7-6s6 2 7 6',
  doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 12h6M9 16h6',
  db: 'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  key: 'M14 4a6 6 0 11-4.6 9.8L4 19v3h3l1-1v-2h2v-2h2l1.4-1.4A6 6 0 0114 4z',
  card: 'M3 6h18v12H3zM3 10h18M7 14h4',
  chip: 'M8 8h8v8H8zM4 10V8h4M4 14v2h4M20 10V8h-4M20 14v2h-4M10 4V6M14 4V6M10 20v-2M14 20v-2',
  music: 'M9 18a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM20 16a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zM9 18V6l11-2v12',
  clockw: 'M12 4a8 8 0 108 8M12 8v4l3 2M12 2v2M2 12h2M12 20v2',
  wand: 'M5 19L17 7M15 5l1-3 1 3 3 1-3 1-1 3-1-3-3-1zM4 8l.6-1.8L6.4 5.6 4.6 5 4 3.2 3.4 5 1.6 5.6l1.8.6z',
  puzzle: 'M10 4h4v2a2 2 0 104 0h2v4h-2a2 2 0 100 4h2v4h-4v-2a2 2 0 10-4 0v2H6v-4h2a2 2 0 100-4H6V6h4z',
  globe: 'M12 3a9 9 0 100 18 9 9 0 000-18zM3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 000 18M12 3a14 14 0 010 18',
  cam: 'M3 8h4l2-3h6l2 3h4v12H3zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z',
  refresh: 'M20 12a8 8 0 11-2.3-5.7M20 3v4h-4',
  question: 'M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17v.5',
  plug: 'M9 3v5M15 3v5M7 8h10v3a5 5 0 01-10 0zM12 16v5',
  book: 'M5 4h6a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2H5zM19 4h-5v13h5z',
};

/* ---------- 全局事件总线：toast / confirm ---------- */
const bus = { listeners: {} };
function on(evt, fn) { (bus.listeners[evt] = bus.listeners[evt] || []).push(fn); }
function emit(evt, val) { (bus.listeners[evt] || []).forEach((f) => f(val)); }
function toast(msg, kind = 'ok') { emit('toast', { msg, kind }); }
function ask(opt) { return new Promise((res) => emit('ask', { ...opt, res })); }

function ToastHost() {
  const [items, setItems] = useState([]);
  useEffect(() => on('toast', (t) => {
    const id = Math.random();
    setItems((cur) => [...cur, { ...t, id }]);
    setTimeout(() => setItems((cur) => cur.filter((x) => x.id !== id)), 3200);
  }), []);
  const color = (k) => (k === 'err' ? '#f3726b' : k === 'warn' ? '#f4b642' : '#4ade80');
  return (
    <div className="toasts">
      {items.map((t) => (
        <div className="toast" key={t.id}>
          <span className="dot" style={{ background: color(t.kind) }} />
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function ConfirmHost() {
  const [opt, setOpt] = useState(null);
  useEffect(() => on('ask', (o) => setOpt(o)), []);
  if (!opt) return null;
  return (
    <div className="backdrop" onMouseDown={() => { opt.res(false); setOpt(null); }}>
      <div className="modal" style={{ maxWidth: 480 }} onMouseDown={(e) => e.stopPropagation()}>
        <div className="modal-body">
          <div className="flex" style={{ gap: 12, alignItems: 'flex-start' }}>
            <span style={{ color: 'var(--warn)', marginTop: 2 }}><I d={P.alert} size={20} /></span>
            <div>
              <div style={{ fontWeight: 650, fontSize: 14.5 }}>{opt.title}</div>
              {opt.body && <div className="muted" style={{ marginTop: 4, whiteSpace: 'pre-line' }}>{opt.body}</div>}
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={() => { opt.res(false); setOpt(null); }}>{opt.cancel || '取消'}</button>
          <button className={opt.danger ? 'btn danger' : 'btn primary'} onClick={() => { opt.res(true); setOpt(null); }}>{opt.confirm || '确认'}</button>
        </div>
      </div>
    </div>
  );
}

function TestButton({ label, busyText, onDone }) {

  };
  return (
    <button className="btn sm" onClick={run} disabled={state === 'busy'}>
      {state === 'busy' ? (
        <span className="flex" style={{ gap: 6 }}>
          <svg className="spin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M12 3a9 9 0 109 9" /></svg>

  );
}

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

/* ---------- 开播台 ---------- */
function ChainNode({ icon, title, value, state, onGo }) {
  const st = state === 'ok' ? { c: 'var(--ok)', t: '已测试' } : state === 'set' ? { c: 'var(--warn)', t: '未测试' } : { c: 'var(--ink-mut)', t: '未配置' };
  return (
    <button className="card chain-node" style={{ padding: '13px 15px', textAlign: 'left' }} onClick={onGo}>
      <div className="flex" style={{ gap: 9 }}>
        <span style={{ color: 'var(--accent)' }}><I d={icon} size={18} /></span>
        <span style={{ fontWeight: 650 }}>{title}</span>
        <span className="dot" style={{ background: st.c, marginLeft: 'auto' }} />
      </div>
      <div style={{ marginTop: 7, fontSize: 13, color: value ? 'var(--ink)' : 'var(--ink-mut)' }}>{value || '尚未选择'}</div>
      <div className="flex" style={{ marginTop: 3, gap: 5 }}>
        <span className="muted" style={{ fontSize: 11.5 }}>{st.t}</span>
        <span style={{ marginLeft: 'auto', color: 'var(--accent)', fontSize: 12, fontWeight: 550, display: 'inline-flex', alignItems: 'center', gap: 2 }}>
          去配置 <I d={P.arrowR} size={12} />
        </span>
      </div>
    </button>
  );
}

function Dashboard({ cfg, running, onGo, onRun, onWizard }) {
  const chain = [
    { icon: P.radio, title: '直播间', key: 'platform' },
    { icon: P.brain, title: 'AI 大脑', key: 'brain' },
    { icon: P.speaker, title: '声音', key: 'voice' },
    { icon: P.person, title: '形象', key: 'body' },
  ];
  const val = (k) => (cfg[k] ? (cfg[k].label || cfg[k].id) : null);
  const st = (k) => (cfg[k] ? (cfg[k].tested ? 'ok' : 'set') : 'none');
  const missing = chain.find((n) => !cfg[n.key]);

  return (
    <div>
      {/* 下一步建议 */}
      <div className="banner info" style={{ padding: '13px 16px' }}>
        <span style={{ marginTop: 1 }}><I d={P.question} size={17} /></span>
        <div style={{ flex: 1 }}>
          {missing ? (
            <React.Fragment>
              <b>还差 1 步就能开播</b> —— 「{missing.title}」还没有配置。
              <button className="link-btn" style={{ marginLeft: 10 }} onClick={() => onGo('settings', missing.key)}>去配置 →</button>
            </React.Fragment>
          ) : (
            <React.Fragment><b>一切就绪</b>，随时可以开播。改过配置记得先保存再重新运行。</React.Fragment>
          )}
          <div className="muted" style={{ fontSize: 12, color: '#6a6ec4', marginTop: 2 }}>
            首次使用建议走一遍 <button className="link-btn" style={{ fontSize: 12 }} onClick={onWizard}>设置向导（5 步 · 约两分钟）</button>
          </div>
        </div>
      </div>

      {/* 信号链 */}
      <div className="sec-title mt20">信号链 <span className="count">弹幕从哪来 → 谁想 → 谁说 → 长什么样</span></div>
      <div className="chain mt12">
        {chain.map((n, i) => (
          <React.Fragment key={n.key}>
            {i > 0 && <div className="chain-arrow"><I d={P.chevR} size={17} /></div>}
            <ChainNode icon={n.icon} title={n.title} value={val(n.key)} state={st(n.key)} onGo={() => onGo('settings', n.key)} />
          </React.Fragment>
        ))}
      </div>

      {/* 运行控制 + 聊天测试 */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: 12, marginTop: 20 }}>
        <div className="card" style={{ padding: 18 }}>
          <div className="flex" style={{ gap: 10 }}>
            <span className="dot" style={{ width: 10, height: 10, background: running ? 'var(--ok)' : '#c4c9d2' }} />
            <div>
              <div style={{ fontWeight: 650 }}>{running ? '直播程序运行中' : '直播程序未运行'}</div>
              <div className="muted" style={{ fontSize: 12 }}>{running ? '已连接哔哩哔哩 · 弹幕监听中' : '点右侧按钮用当前配置启动 main.py'}</div>
            </div>
            <div style={{ marginLeft: 'auto' }}>
              {running ? (
                <button className="btn danger" onClick={() => onRun(false)}>■ 停止</button>
              ) : (
                <button className="btn primary" onClick={() => onRun(true)}>▶ 开始直播</button>
              )}

          </div>
          <div className="flex mt12" style={{ gap: 8 }}>
            <button className="btn sm" onClick={() => toast('打开运行日志（原型演示）')}>运行日志</button>

            <span className="muted" style={{ fontSize: 11.5, marginLeft: 'auto', alignSelf: 'center' }}>配置变更后需重启生效</span>
          </div>
        </div>
        <ChatPanel />
      </div>
    </div>
  );
}

function ChatPanel() {
  const [msgs, setMsgs] = useState([
    { who: 'ai', text: '配置好大脑和声音后，在这里发一句话就能听到她回答～' },
  ]);
  const [input, setInput] = useState('');
  const replies = ['今天天气真不错，适合出门散步呢～', '这个问题难不倒我，答案是 42！', '呼呼…刚在打瞌睡，被你叫醒啦。'];
  const ri = React.useRef(0);
  const send = () => {
    if (!input.trim()) return;
    const text = input.trim();
    setMsgs((m) => [...m, { who: 'me', text }]);
    setInput('');
    setTimeout(() => {
      ri.current = (ri.current + 1) % replies.length;
      setMsgs((m) => [...m, { who: 'ai', text: replies[ri.current] }]);
      toast('已合成语音并播放（演示）');
    }, 700);
  };
  return (
    <div className="card" style={{ padding: 14, display: 'flex', flexDirection: 'column' }}>
      <div className="flex" style={{ gap: 8, marginBottom: 8 }}>
        <span style={{ color: 'var(--accent)' }}><I d={P.chat || P.doc} size={15} /></span>
        <b style={{ fontSize: 13 }}>聊天测试</b>

const { useState, useEffect } = React;

/* ---------- 玩法库 ---------- */
function Gameplay({ state, setState }) {
  const [filter, setFilter] = useState('all');
  const groups = [['直播互动', '让观众玩起来'], ['自动运营', '没人也不断播'], ['进阶联动', '硬核玩家专属']];
  const onCount = state.filter(Boolean).length;
  const list = GAMEPLAY.filter((g, i) => filter === 'all' ? true : filter === 'on' ? state[i] : g.g === filter);
  return (
    <div>
      <div className="chip-row" style={{ marginBottom: 16 }}>
        {[['all', '全部 ' + GAMEPLAY.length], ['on', '已启用 ' + onCount], ['直播互动', '直播互动'], ['自动运营', '自动运营'], ['进阶联动', '进阶联动']].map(([k, t]) => (
          <button key={k} className={'chip' + (filter === k ? ' on' : '')} onClick={() => setFilter(k)}>{t}</button>
        ))}
      </div>
      {groups.map(([g, sub]) => {
        const items = list.filter((x) => x.g === g);
        if (!items.length) return null;
        return (
          <div key={g} className="mt16">
            <div className="sec-title">{g} <span className="count">{sub}</span></div>
            <div className="play-grid mt12">
              {items.map((g0) => {
                const idx = GAMEPLAY.indexOf(g0);
                const on = state[idx];
                return (
                  <div key={g0.name} className={'play-card' + (on ? ' on' : '')}>
                    <div className="play-head">
                      <span style={{ color: on ? 'var(--accent)' : 'var(--ink-mut)' }}><I d={g0.icon} size={17} /></span>
                      <span className="play-name">{g0.name}</span>
                      <span style={{ marginLeft: 'auto' }}>
                        <Switch checked={on} onChange={(v) => { const n = [...state]; n[idx] = v; setState(n); toast(v ? '已开启「' + g0.name + '」· 改动待保存' : '已关闭「' + g0.name + '」'); }} />
                      </span>
                    </div>
                    <div className="play-desc">{g0.desc}</div>
                    {on && g0.fields.length > 0 && (

/* ---------- 弹幕管家 ---------- */
function Moderation() {
  const [tab, setTab] = useState('order');
  const [order, setOrder] = useState(PRIORITY_INIT);
  const dragIdx = React.useRef(null);
  const [dragState, setDragState] = useState({ from: -1, over: -1 });

  const onDragStart = (i) => { dragIdx.current = i; setDragState({ from: i, over: -1 }); };
  const onDragOver = (i, e) => { e.preventDefault(); setDragState((s) => ({ ...s, over: i })); };
  const onDrop = (i) => {
    const from = dragIdx.current;
    if (from === null || from === i) return;
    const next = [...order];
    const [it] = next.splice(from, 1);
    next.splice(i, 0, it);
    setOrder(next);
    setDragState({ from: -1, over: -1 });
    toast('播报顺序已更新 · 改动待保存');
  };

  return (
    <div>
      <div className="chip-row" style={{ marginBottom: 16 }}>

                onDragEnd={() => { setDragState({ from: -1, over: -1 }); }}
              >
                <span className="muted"><I d={P.grip} size={14} /></span>

        </div>
      )}

  );
}

      title: '保存这 ' + dirty + ' 项改动？',
      body: '平台：' + (cfg.platform ? cfg.platform.label : '未选') + ' · 大脑：' + (cfg.brain ? cfg.brain.label : '未选')
        + '\n声音：' + (cfg.voice ? cfg.voice.label : '未选') + ' · 形象：' + (cfg.body ? cfg.body.label : '未选')
        + '\n\n保存后正在运行的程序需重启才会用到新配置。',
      confirm: '保存',
    });
    if (ok) { setDirty(0); toast('配置已保存到 config.json'); }
  };

  const go = (scr, st) => { setScreen(scr); if (st) setStep(st); };
  const nav = NAV.find((n) => n.id === screen);
  const titles = { settings: STEP_META[step].title, settingsSub: STEP_META[step].sub };
  const isSettings = screen === 'settings';

  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="brand">
          <span className="brand-mark"><I d={P.play} size={15} /></span>
          <div>
            <div className="brand-name">AI Vtuber</div>
            <div className="brand-sub">重设计原型 v1</div>
          </div>
        </div>
        <nav className="nav">
          {NAV.map((n) => (
            <button key={n.id} className={'nav-item' + (screen === n.id ? ' on' : '')} onClick={() => setScreen(n.id)}>
              <I d={n.icon} size={16} />
              {n.title}
              {n.id === 'play' && play.filter(Boolean).length > 0 && <span className="nav-badge">{play.filter(Boolean).length}</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          <button className="ghost-btn" onClick={() => setWizard(true)}>
            <I d={P.wand} size={13} /> 重新运行设置向导
          </button>
          <button className="ghost-btn" onClick={() => setHelp(true)}>
            <I d={P.question} size={13} /> 这个原型改了什么
          </button>
          <div className="proto-note">交互演示 · 数据为假<br />配套文档见 docs/redesign</div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div>
            <div className="topbar-title">{isSettings ? '基础设置 · ' + titles.settings : nav.title}</div>
            <div className="topbar-sub">{isSettings ? titles.settingsSub : nav.sub}</div>
          </div>
          <div className="topbar-right">
            <div className="searchbox"><I d={P.search} size={14} /> 搜索配置项 <kbd>Ctrl K</kbd></div>
            <span className="pill" style={{ color: running ? 'var(--ok)' : 'var(--ink-mut)' }}>
              <span className="dot" style={{ background: running ? 'var(--ok)' : '#c4c9d2' }} />
              {running ? '运行中' : '未运行'}
            </span>
            <button className="btn primary" onClick={save}>
              <I d={P.save} size={14} /> 保存{dirty > 0 ? '（' + dirty + '）' : ''}
            </button>
          </div>
        </header>

        <main className="content">
          {screen === 'dash' && <Dashboard cfg={cfg} running={running} onGo={go} onRun={onRun} onWizard={() => setWizard(true)} />}
          {isSettings && <Settings cfg={cfg} step={step} onStep={setStep} onSelect={select} />}
          {screen === 'play' && <Gameplay state={play} setState={(n) => { setPlay(n); setDirty((d) => d + 1); }} />}
          {screen === 'mod' && <Moderation />}
          {screen === 'sys' && <SystemPage theme={theme} setTheme={setTheme} />}
        </main>
      </div>

      {wizard && (
        <Wizard cfg={cfg} onClose={() => setWizard(false)} onDone={(pick) => {
          setCfg({
            platform: { id: pick.platform, label: PLATFORMS.find((p) => p.id === pick.platform).name, tested: false },
            brain: { id: pick.brain, label: LLM.find((p) => p.id === pick.brain).name, tested: false },
            voice: { id: pick.voice, label: TTS.find((p) => p.id === pick.voice).name, tested: false },
            body: { id: pick.body, label: BODIES.find((p) => p.id === pick.body).name, tested: false },
          });
          setWizard(false);
          setRunning(true);
          setDirty((d) => d + 1);
          toast('向导完成 · 已按新配置开始试运行');
        }} />
      )}
      {help && <HelpModal onClose={() => setHelp(false)} />}
      <ToastHost />
      <ConfirmHost />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
