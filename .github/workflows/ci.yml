name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint（ruff check + format 校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements/dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy (infra+common 基线)
        run: python -m mypy

  core:
    name: 单元测试 + WebUI 冒烟（仅 core 依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # PyAudio 在 Linux 上没有预编译 wheel，需要 portaudio 开发头文件现编
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements/core.lock.txt -r requirements/dev.txt

      - name: Unit tests
        run: python -m pytest

      - name: WebUI smoke test
        run: python tools/smoke_test.py
